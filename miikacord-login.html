<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090e">
<title>Entrar — MiikaCord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235865f2'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='18' font-weight='700' fill='white'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;
    --bg:#08090e;
    --panel:rgba(18,20,29,.9);
    --line:rgba(255,255,255,.08);
    --text:#f4f6fb;
    --muted:#9aa2b5;
    --muted-2:#6e7689;
    --brand:#5865f2;
    --brand-2:#8b5cf6;
    --green:#2bd576;
    --red:#ff5a65;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    padding:28px 18px;
    overflow-x:hidden;
    color:var(--text);
    background:
      radial-gradient(900px 520px at 18% -10%,rgba(88,101,242,.24),transparent 62%),
      radial-gradient(760px 480px at 100% 8%,rgba(139,92,246,.16),transparent 60%),
      var(--bg);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.14;
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:68px 68px;
    mask-image:linear-gradient(to bottom,#000,rgba(0,0,0,.35) 52%,transparent 82%);
    -webkit-mask-image:linear-gradient(to bottom,#000,rgba(0,0,0,.35) 52%,transparent 82%);
  }

  .brand{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .logo{
    position:relative;
    display:grid;
    place-items:center;
    width:46px;
    height:46px;
    overflow:hidden;
    border-radius:14px;
    color:#fff;
    font-size:19px;
    font-weight:800;
    background:linear-gradient(145deg,#8792ff,#5b63f1 52%,#7c3aed);
    box-shadow:0 12px 30px -9px rgba(88,101,242,.85),inset 0 1px 0 rgba(255,255,255,.4);
  }

  .logo::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.38),transparent 46%);
  }

  .logo span{position:relative;z-index:1}

  .brand-name{display:block;font-size:18px;font-weight:750;letter-spacing:-.025em}
  .brand-sub{display:block;margin-top:3px;color:var(--muted-2);font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    padding:28px;
    border:1px solid var(--line);
    border-radius:24px;
    background:linear-gradient(180deg,rgba(24,27,38,.94),rgba(13,15,22,.96));
    box-shadow:0 38px 90px -34px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
  }

  .card::before{
    content:"";
    position:absolute;
    top:-1px;
    left:18%;
    right:18%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(167,139,250,.7),transparent);
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 10px;
    border:1px solid rgba(139,148,255,.2);
    border-radius:999px;
    background:rgba(109,124,255,.07);
    color:#b8c0ff;
    font-size:10.5px;
    font-weight:650;
  }

  .eyebrow::before{content:"";width:5px;height:5px;border-radius:50%;background:#8b95ff;box-shadow:0 0 0 3px rgba(109,124,255,.12)}

  h1{margin-top:14px;font-size:27px;font-weight:760;line-height:1.1;letter-spacing:-.04em}
  .subtitle{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.6}

  .switch{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
    margin-top:22px;
    padding:4px;
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(5,6,10,.45);
  }

  .switch button{
    padding:8px 10px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:var(--muted);
    font-size:12px;
    font-weight:650;
    transition:background .18s ease,color .18s ease;
  }

  .switch button:hover{color:var(--text)}
  .switch button.active{background:rgba(88,101,242,.24);color:#fff;box-shadow:inset 0 0 0 1px rgba(139,148,255,.22)}

  form{display:flex;flex-direction:column;gap:13px;margin-top:18px}

  .field{display:flex;flex-direction:column;gap:6px}
  .field label{color:#b8c0d2;font-size:11px;font-weight:650;letter-spacing:.03em}

  .field input{
    width:100%;
    height:46px;
    padding:0 13px;
    border:1px solid var(--line);
    border-radius:11px;
    outline:0;
    background:rgba(5,6,10,.55);
    color:var(--text);
    font:inherit;
    font-size:13px;
    transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
  }

  .field input::placeholder{color:#626a7e}
  .field input:hover{border-color:rgba(255,255,255,.14)}
  .field input:focus{border-color:rgba(109,124,255,.7);background:rgba(5,6,10,.76);box-shadow:0 0 0 4px rgba(88,101,242,.13)}

  .submit{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:47px;
    margin-top:4px;
    border:0;
    border-radius:11px;
    color:#fff;
    background:linear-gradient(135deg,#7b88ff,#5865f2 52%,#6d4aff);
    box-shadow:0 14px 28px -12px rgba(88,101,242,.95),inset 0 1px 0 rgba(255,255,255,.24);
    font-size:13px;
    font-weight:650;
    transition:transform .18s ease,filter .18s ease;
  }

  .submit:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .submit:active{transform:none}
  .submit:disabled{opacity:.6;cursor:wait;transform:none}

  .status{
    min-height:18px;
    color:var(--muted-2);
    font-size:11.5px;
    line-height:1.45;
    text-align:center;
  }

  .status.error{color:#ff9aa1}
  .status.ok{color:#7deee0}

  .demo-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:2px;
    padding-top:14px;
    border-top:1px solid var(--line);
    color:#8f98ae;
    font-size:11.5px;
    font-weight:550;
    text-decoration:none;
  }

  .demo-link:hover{color:#c8cfff}
  .demo-link svg{width:14px;height:14px}

  .footer{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:14px;
    color:#5d6476;
    font-size:10.5px;
  }

  .footer a{color:#7d869b;text-decoration:none}
  .footer a:hover{color:#c8cfff}

  .hidden{display:none!important}

  @media (max-width:480px){
    body{gap:20px;padding:20px 14px}
    .card{padding:22px;border-radius:20px}
    h1{font-size:24px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<header class="brand">
  <div class="logo" aria-hidden="true"><span>M</span></div>
  <div>
    <span class="brand-name">MiikaCord</span>
    <span class="brand-sub">Chat em tempo real</span>
  </div>
</header>

<main class="card">
  <span class="eyebrow">Sua comunidade começa aqui</span>
  <h1 id="title">Bem-vindo de volta</h1>
  <p class="subtitle" id="subtitle">Entre para continuar suas conversas e acompanhar os canais.</p>

  <div class="switch" role="tablist" aria-label="Entrar ou criar conta">
    <button type="button" class="active" data-mode="login" role="tab" aria-selected="true">Entrar</button>
    <button type="button" data-mode="signup" role="tab" aria-selected="false">Criar conta</button>
  </div>

  <form id="authForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
    </div>

    <div class="field hidden" id="usernameField">
      <label for="username">Nome de exibição</label>
      <input id="username" type="text" placeholder="Como quer ser chamado?" maxlength="20" autocomplete="nickname">
    </div>

    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="current-password" minlength="6" required>
    </div>

    <button class="submit" id="submitBtn" type="submit">Entrar</button>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <a class="demo-link" href="miikacord-chat.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
      <circle cx="12" cy="12" r="2.7"></circle>
    </svg>
    Explorar sem conta
  </a>
</main>

<footer class="footer">
  <span>MiikaCord © 2026</span>
  <span aria-hidden="true">•</span>
  <a href="miikacord-screen.html">Compartilhar tela</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const sb = supabase.createClient(
    'https://jldkrcgfjvaalouoxgqa.supabase.co',
    'sb_publishable_igul1pyZmV8V4wmm1VBxfg_YyzEXToO'
  );

  const form = document.getElementById('authForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const username = document.getElementById('username');
  const usernameField = document.getElementById('usernameField');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const title = document.getElementById('title');
  const subtitle = document.getElementById('subtitle');
  const switchButtons = document.querySelectorAll('[data-mode]');

  let mode = 'login';

  function setStatus(text, type) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (type ? ' ' + type : '');
  }

  function authErrorMessage(error) {
    const message = error && error.message ? error.message : '';
    const messages = {
      'Invalid login credentials': 'E-mail ou senha incorretos.',
      'Email not confirmed': 'Confirme seu e-mail antes de entrar.',
      'User already registered': 'Este e-mail já está cadastrado. Tente entrar.',
      'Password should be at least 6 characters': 'A senha precisa ter pelo menos 6 caracteres.',
      'Unable to validate email address: invalid format': 'Informe um e-mail válido.',
      'Database error saving new user': 'O banco de dados recusou a criação do perfil. Aplique a correção supabase/fix-auth.sql no SQL Editor do Supabase.'
    };
    return messages[message] || message || 'Não foi possível concluir. Tente novamente.';
  }

  function setMode(nextMode) {
    mode = nextMode;
    const isSignup = mode === 'signup';

    switchButtons.forEach((button) => {
      const active = button.dataset.mode === mode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', String(active));
    });

    usernameField.classList.toggle('hidden', !isSignup);
    username.required = isSignup;
    password.autocomplete = isSignup ? 'new-password' : 'current-password';
    submitBtn.textContent = isSignup ? 'Criar conta' : 'Entrar';
    title.textContent = isSignup ? 'Crie sua conta' : 'Bem-vindo de volta';
    subtitle.textContent = isSignup
      ? 'Escolha um nome, informe seu e-mail e comece a conversar.'
      : 'Entre para continuar suas conversas e acompanhar os canais.';
    setStatus('');
  }

  switchButtons.forEach((button) => {
    button.addEventListener('click', () => setMode(button.dataset.mode));
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const emailValue = email.value.trim();
    const passwordValue = password.value;

    if (!emailValue || !passwordValue) {
      setStatus('Preencha o e-mail e a senha.', 'error');
      return;
    }

    if (passwordValue.length < 6) {
      setStatus('A senha precisa ter pelo menos 6 caracteres.', 'error');
      return;
    }

    submitBtn.disabled = true;
    setStatus(mode === 'signup' ? 'Criando sua conta…' : 'Entrando…');

    try {
      if (mode === 'signup') {
        const displayName = username.value.trim() || emailValue.split('@')[0];
        const { data, error } = await sb.auth.signUp({
          email: emailValue,
          password: passwordValue,
          options: { data: { username: displayName } }
        });

        if (error) throw error;

        if (data.session) {
          location.href = 'miikacord-chat.html';
          return;
        }

        form.reset();
        setMode('login');
        setStatus('Conta criada! Confira seu e-mail para confirmar o cadastro.', 'ok');
      } else {
        const { error } = await sb.auth.signInWithPassword({
          email: emailValue,
          password: passwordValue
        });

        if (error) throw error;
        location.href = 'miikacord-chat.html';
      }
    } catch (error) {
      setStatus(authErrorMessage(error), 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) location.href = 'miikacord-chat.html';
  });
</script>
</body>
</html>
