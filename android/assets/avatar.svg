<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="16%" r="95%">
      <stop offset="0%" stop-color="#2a1550"/>
      <stop offset="55%" stop-color="#0c0818"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="158" cy="132" r="168" fill="url(#violet)" filter="url(#soft)"/>
  <circle cx="392" cy="356" r="172" fill="url(#cyan)" filter="url(#soft)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".16">
    <circle cx="256" cy="256" r="186" stroke-width="1"/>
    <circle cx="256" cy="256" r="150" stroke-width="1" stroke-dasharray="2 8"/>
    <ellipse cx="256" cy="256" rx="232" ry="88" transform="rotate(-26 256 256)" stroke-width="1"/>
    <ellipse cx="256" cy="256" rx="232" ry="88" transform="rotate(32 256 256)" stroke-width="1" stroke-opacity=".08"/>
  </g>
  <circle cx="406" cy="172" r="4" fill="#67e8f9"/>
  <circle cx="96" cy="328" r="3" fill="#c4b5fd"/>
  <circle cx="382" cy="392" r="2.4" fill="#ffffff" fill-opacity=".7"/>
  <text x="256" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="258" font-style="italic" fill="url(#ink)">T</text>
  <rect width="512" height="512" filter="url(#grain)" opacity=".7"/>
</svg>
